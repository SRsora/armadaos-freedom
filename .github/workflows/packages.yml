"---\nname: Packages\n\n# Builds each package as a Containerfile stage and hands the result to the image\n# build. One job per package so they build in parallel. Folding them into the\n# image build would serialise 20 builds onto one machine.\n\non:\n  workflow_call:\n    outputs:\n      build_args:\n        description: \"PKG_REF=<image> lines, one per package, for --build-arg-file\"\n        value: ${{ jobs.prepare.outputs.build_args }}\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  packages: write\n\njobs:\n  prepare:\n    name: Resolve packages\n    runs-on: ubuntu-24.04\n    permissions:\n      contents: read\n      packages: read\n    outputs:\n      matrix: ${{ steps.resolve.outputs.matrix }}\n      build_args: ${{ steps.resolve.outputs.build_args }}\n    steps:\n      - name: Check out source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n\n      - name: Install skopeo\n        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }\n\n      - name: Resolve what needs building\n        id: resolve\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          set -euo pipefail\n          owner=\"${{ github.repository_owner }}\"\n          repo=\"ghcr.io/${owner,,}/armada/pkg\"\n          echo \"${GH_TOKEN}\" | skopeo login ghcr.io -u \"${{ github.actor }}\" --password-stdin\n\n          matrix='[]'\n          args=\"\"\n          # The package set is the directories themselves, so it cannot drift\n          # from the tree. Only the cross-compiled ones need a non-arm runner.\n          for dir in packages/*/; do\n            pkg=\"$(basename \"${dir}\")\"\n            [ -f \"${dir}/build.sh\" ] || continue\n            hash=\"$(packages/package-hash.sh \"${pkg}\")\"\n            ref=\"${repo}/${pkg}:${hash}\"\n\n            case \"${pkg}\" in\n              mesa-android|lepton|mesa-x86) runner=ubuntu-24.04 ;;\n              *)                            runner=ubuntu-24.04-arm ;;\n            esac\n\n            if skopeo inspect --raw \"docker://${ref}\" >/dev/null 2>&1; then\n              echo \"::notice::${pkg} already built (${hash})\"\n            else\n              echo \"::notice::${pkg} needs building (${hash})\"\n              matrix=\"$(jq -c --arg p \"${pkg}\" --arg r \"${runner}\" --arg h \"${hash}\" \\\n                '. + [{package:$p, runner:$r, hash:$h}]' <<<\"${matrix}\")\"\n            fi\n\n            # The image build needs a ref for every package, built now or not.\n            var=\"$(printf '%s' \"${pkg}\" | tr '[:lower:]-' '[:upper:]_')_REF\"\n            args=\"${args}${var}=${ref}\"$'\\n'\n          done\n\n          echo \"matrix=${matrix}\" >> \"${GITHUB_OUTPUT}\"\n          {\n            echo \"build_args<<BUILD_ARGS_EOF\"\n            printf '%s' \"${args}\"\n            echo \"BUILD_ARGS_EOF\"\n          } >> \"${GITHUB_OUTPUT}\"\n          echo \"### Packages to build: $(jq length <<<\"${matrix}\")\" >> \"${GITHUB_STEP_SUMMARY}\"\n          jq -r '.[] | \"- \\(.package)\"' <<<\"${matrix}\" >> \"${GITHUB_STEP_SUMMARY}\"\n\n  build:\n    name: ${{ matrix.package }}\n    needs: prepare\n    if: needs.prepare.outputs.matrix != '[]'\n    runs-on: ${{ matrix.runner }}\n    strategy:\n      fail-fast: false\n      matrix:\n        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}\n    steps:\n      - name: Check out source\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n\n      - name: Free build space\n        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9\n        with:\n          remove-codeql: true\n\n      - name: Install container tools\n        run: |\n          set -euxo pipefail\n          need=\"\"\n          for t in buildah skopeo; do\n            command -v \"$t\" >/dev/null || need=\"$need $t\"\n          done\n          # Runner crun mismatches podman (\"crun: unknown version specified\").\n          command -v runc >/dev/null || need=\"$need runc\"\n          [ -z \"$need\" ] || { sudo apt-get update && sudo apt-get install -y $need; }\n          mkdir -p ~/.config/containers\n          printf '[engine]\\nruntime = \"runc\"\\n' > ~/.config/containers/containers.conf\n\n      - name: Resolve builder images\n        run: |\n          set -euo pipefail\n          # Only the FROM images need to cross the build-arg boundary. build.sh\n          # sources toolchain.env itself from /src inside the stage.\n          source packages/toolchain.env\n          source packages/mesa-x86/BASE.env\n          echo \"BUILDER_IMAGE=${BUILDER_IMAGE}\" >> \"${GITHUB_ENV}\"\n          echo \"GUEST_BUILDER_IMAGE=${GUEST_BUILDER_IMAGE}\" >> \"${GITHUB_ENV}\"\n          owner=\"${{ github.repository_owner }}\"\n          echo \"CACHE_REPO=ghcr.io/${owner,,}/armada/buildcache/${{ matrix.package }}\" >> \"${GITHUB_ENV}\"\n\n      - name: Locate buildah cache mounts\n        id: cachedir\n        run: echo \"dir=/var/tmp/buildah-cache-$(id -u)\" >> \"${GITHUB_OUTPUT}\"\n\n      - name: ccache\n        # Buildah's cache mounts live outside the layer store, so they start\n        # empty on a fresh runner unless restored here.\n        if: matrix.package == 'kernel' || matrix.package == 'mesa'\n        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4.2.3\n        with:\n          path: ${{ steps.cachedir.outputs.dir }}\n          # hash the pinned toolchain into the key so a bump cannot serve stale objects\n          key: ccache-${{ matrix.package }}-${{ runner.arch }}-${{ hashFiles('packages/toolchain.env') }}-${{ hashFiles(format('packages/{0}/**', matrix.package)) }}\n          restore-keys: |\n            ccache-${{ matrix.package }}-${{ runner.arch }}-${{ hashFiles('packages/toolchain.env') }}-\n\n      - name: Log in to GHCR\n        run: echo \"${{ secrets.GITHUB_TOKEN }}\" | buildah login -u \"${{ github.actor }}\" --password-stdin ghcr.io\n\n      - name: Build and publish\n        env:\n          PACKAGE: ${{ matrix.package }}\n          HASH: ${{ matrix.hash }}\n        run: |\n          set -euxo pipefail\n          owner=\"${{ github.repository_owner }}\"\n          REF=\"ghcr.io/${owner,,}/armada/pkg/${PACKAGE}:${HASH}\"\n\n          buildah build \\\n            -f packages/Containerfile \\\n            --target \"out-${PACKAGE}\" \\\n            --layers \\\n            --cache-from \"${CACHE_REPO}\" \\\n            --cache-to \"${CACHE_REPO}\" \\\n            --build-arg \"BUILDER_IMAGE=${BUILDER_IMAGE}\" \\\n            --build-arg \"GUEST_BUILDER_IMAGE=${GUEST_BUILDER_IMAGE}\" \\\n            -t \"${REF}\" \\\n            packages/\n\n          # Another run can publish this hash while we build. Identical inputs,\n          # so skipping is safe, but warn in case the hash is missing an input.\n          if skopeo inspect --raw \"docker://${REF}\" >/dev/null 2>&1; then\n            echo \"::warning::${REF} already published, skipping push\"\n          else\n            buildah push \"${REF}\"\n          fi\n          {\n            echo \"### \\`${PACKAGE}\\` published\"\n            echo '```'\n            echo \"${REF}\"\n            echo '```'\n          } >> \"${GITHUB_STEP_SUMMARY}\"\n\n  # Publishes are only useful if an anonymous consumer can read every package\n  # the image build will reference. Covers cache hits and newly built packages.\n  public_read:\n    name: Verify packages are publicly readable\n    needs: [prepare, build]\n    if: >-\n      !cancelled() && needs.prepare.result == 'success' &&\n      (needs.build.result == 'success' || needs.build.result == 'skipped')\n    runs-on: ubuntu-24.04\n    permissions: {}\n    steps:\n      - name: Install skopeo\n        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }\n\n      - name: Inspect every package anonymously\n        env:\n          PKG_REFS: ${{ needs.prepare.outputs.build_args }}\n          OWNER: ${{ github.repository_owner }}\n        run: |\n          set -euo pipefail\n          failed=0\n          checked=0\n          while IFS= read -r line; do\n            [ -n \"${line}\" ] || continue\n            ref=\"${line#*=}\"\n            [ -n \"${ref}\" ] || { echo \"::error::empty ref in '${line}'\"; failed=1; continue; }\n            checked=$((checked + 1))\n            if out=$(skopeo inspect --no-creds --raw \"docker://${ref}\" 2>&1); then\n              echo \"::notice::public: ${ref}\"\n            else\n              failed=1\n              echo \"::error::not anonymously readable: ${ref}\"\n              printf '%s\\n' \"${out}\" | sed 's/^/    /'\n            fi\n          done <<< \"${PKG_REFS}\"\n          if [ \"${checked}\" -eq 0 ]; then\n            echo \"::error::no package refs to verify (expected build_args from prepare)\"\n            failed=1\n          fi\n          if [ \"${failed}\" -ne 0 ]; then\n            {\n              echo \"### Package images are not all anonymously readable\"\n              echo \"A failure can mean the package is private, missing, or the\"\n              echo \"registry could not be reached; the message above does not\"\n              echo \"prove which. GitHub Packages images start private even when\"\n              echo \"the repository is public. Each package image must be made\"\n              echo \"Public separately under the owner's Packages settings, then\"\n              echo \"rerun this workflow. See\"\n              echo \"https://docs.github.com/en/packages/learn-github-packages/configuring-a-packages-access-control-and-visibility\"\n            } >> \"${GITHUB_STEP_SUMMARY}\"\n            exit 1\n          fi\n          echo \"::notice::all ${checked} package refs are anonymously readable\"\n"